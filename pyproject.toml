[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-manager-memory"
version = "0.4.0"
description = "Portable repository-local project memory and active-task handoffs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "geekybobz" }]
dependencies = []

[project.scripts]
project-manager = "project_manager.cli:main"
pmem = "project_manager.cli:main"

[tool.setuptools]
packages = ["project_manager"]
include-package-data = true

[tool.setuptools.package-data]
project_manager = ["templates/project-memory/*.md", "templates/project-memory/*.json", "templates/project-memory/rules/*.md", "templates/project-memory/review/*.md", "templates/project-memory/review/.gitignore"]
